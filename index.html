<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>三分鐘生存挑戰</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a1a;
            font-family: Arial, sans-serif;
            cursor: none; /* 隱藏滑鼠 */
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            pointer-events: none;
        }
        #gameCanvas {
            display: block;
        }
        /* 全螢幕圖片容器 */
        #winOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        #winOverlay img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

<div id="ui">剩餘時間: <span id="timer">180</span>s</div>
<canvas id="gameCanvas"></canvas>

<div id="winOverlay">
    <img src="https://img.sanishtech.com/u/26790a42c2a231ee5118f57c9e97df48.png" alt="恭喜通關">
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const timerDisplay = document.getElementById('timer');
    const winOverlay = document.getElementById('winOverlay');

    let gameActive = true;
    let timeLeft = 180;
    let particles = [];
    let player = { x: 0, y: 0, radius: 10 };

    // 初始化畫布大小
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 追蹤滑鼠
    window.addEventListener('mousemove', (e) => {
        player.x = e.clientX;
        player.y = e.clientY;
    });

    // 障礙物類別
    class Obstacle {
        constructor() {
            this.radius = Math.random() * 15 + 5;
            this.reset();
        }
        reset() {
            // 從畫面邊緣生成
            const side = Math.floor(Math.random() * 4);
            if (side === 0) { // Top
                this.x = Math.random() * canvas.width;
                this.y = -this.radius;
            } else if (side === 1) { // Right
                this.x = canvas.width + this.radius;
                this.y = Math.random() * canvas.height;
            } else if (side === 2) { // Bottom
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + this.radius;
            } else { // Left
                this.x = -this.radius;
                this.y = Math.random() * canvas.height;
            }
            // 隨時間增加速度
            let speedMult = 1 + (180 - timeLeft) / 30; 
            this.vx = (Math.random() - 0.5) * 4 * speedMult;
            this.vy = (Math.random() - 0.5) * 4 * speedMult;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;

            // 超出邊界重置
            if (this.x < -50 || this.x > canvas.width + 50 || 
                this.y < -50 || this.y > canvas.height + 50) {
                this.reset();
            }

            // 碰撞檢測
            const dx = this.x - player.x;
            const dy = this.y - player.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < this.radius + player.radius) {
                gameOver();
            }
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ff4757';
            ctx.fill();
            ctx.closePath();
        }
    }

    // 初始化障礙物
    for (let i = 0; i < 40; i++) {
        particles.push(new Obstacle());
    }

    // 倒數計時器
    const timerInterval = setInterval(() => {
        if (gameActive) {
            timeLeft--;
            timerDisplay.textContent = timeLeft;
            if (timeLeft <= 0) {
                winGame();
            }
        }
    }, 1000);

    function gameOver() {
        alert("被撞到了！再試一次。");
        location.reload();
    }

    function winGame() {
        gameActive = false;
        clearInterval(timerInterval);
        winOverlay.style.display = 'flex';
        document.body.style.cursor = 'default';
    }

    function animate() {
        if (!gameActive) return;
        ctx.fillStyle = 'rgba(26, 26, 26, 0.3)'; // 拖尾效果
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 畫玩家
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#1e90ff';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#1e90ff';
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.closePath();

        // 更新並畫障礙物
        particles.forEach(p => {
            p.update();
            p.draw();
        });

        requestAnimationFrame(animate);
    }

    animate();
</script>

</body>
</html>
